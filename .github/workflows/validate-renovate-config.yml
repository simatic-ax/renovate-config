name: Validate Renovate Configuration

on:
  # Läuft bei Pull Requests auf Konfigurationsänderungen
  pull_request:
    paths:
      - 'Global-Config/**'
      - '.github/workflows/**'
  
  # Läuft bei Push auf main Branch
  push:
    branches:
      - main
    paths:
      - 'Global-Config/**'
      - '.github/workflows/**'

jobs:
  validate-config:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/simatic-ax/ci-images/apax-ci-image:4.3.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Validate Renovate Configuration
        shell: bash
        run: renovate-config-validator Global-Config/config.yml
