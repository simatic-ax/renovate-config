# Global Renovate configuration
platform: "github"
gitAuthor: "simatic-ax-bot <ax-public@gmx.de>"
onboarding: false
requireConfig: "required"
autodiscoverFilter: "simatic-ax/*"
separateMajorMinor: false
# Rate limits: bot runs weekly in batch mode, so we want all detected updates
# to be raised as PRs in a single run. Disable the hourly PR cap (default: 2)
# while keeping the concurrent-PR safety net (default: 10) in place.
prHourlyLimit: 0
# Default branches to scan - can be overridden via RENOVATE_BASE_BRANCHES env var.
# Regex patterns must be enclosed in slashes (/.../).
baseBranchPatterns: ["main", "/^release\\/.*/"]

# Dependencies that cannot be resolved (e.g. hosted on separate Enterprise instance)
ignoreDeps:
  - simatic-ax/internal-actions

# Enable managers for custom dependency detection
enabledManagers:
  - custom.regex
  - github-actions

# Package-specific rules for registry URLs and update strategies.
#
# Rule ordering matters: Renovate applies rules top-down and later rules
# override earlier ones for the same field (e.g. groupName). We therefore
# apply the generic major/non-major grouping FIRST and then let the more
# specific domain rules (actions, docker images) override the groupName so
# that CI-related updates land in their own PRs, separate from library deps.
packageRules:
  # --- Registry URLs (do not set groupName) ---
  # Registry URL for @ax/ packages
  - matchPackageNames:
      - "@ax/{/,}**"
    registryUrls:
      - "https://registry.simatic-ax.siemens.io/"
  # Registry URL for @simatic-ax packages
  - matchPackageNames:
      - "@simatic-ax{/,}**"
    registryUrls:
      - "https://npm.pkg.github.com/"

  # --- Generic grouping by update type (applied first, may be overridden below) ---
  # Major updates only on main branch
  - matchUpdateTypes:
      - major
    matchBaseBranches:
      - main
    groupName: "major dependencies"
  # Minor and patch updates on all branches (main and release/*)
  - matchUpdateTypes:
      - minor
      - patch
    matchBaseBranches:
      - main
      - "/^release\\/.*/"
    groupName: "non-major dependencies"

  # --- Range strategy for regex-managed apax dependencies ---
  - matchManagers:
      - custom.regex
    matchCurrentVersion: "/^\\^\\d+\\.\\d+\\.\\d+$/"
    rangeStrategy: bump

  # --- Domain-specific grouping (applied LAST so their groupName wins) ---
  # These rules ensure that CI infrastructure updates (Actions, container
  # images) always land in dedicated PRs, regardless of update type.
  # matchBaseBranches preserves the "major only on main" policy while allowing
  # non-major updates to also land on release branches.
  #
  # Group simatic-ax GitHub Actions together
  - matchManagers:
      - github-actions
    matchPackageNames:
      - "simatic-ax/{/,}**"
    matchUpdateTypes:
      - major
    matchBaseBranches:
      - main
    groupName: "simatic-ax actions"
  - matchManagers:
      - github-actions
    matchPackageNames:
      - "simatic-ax/{/,}**"
    matchUpdateTypes:
      - minor
      - patch
    matchBaseBranches:
      - main
      - "/^release\\/.*/"
    groupName: "simatic-ax actions"
  # Group third-party GitHub Actions together
  - matchManagers:
      - github-actions
    matchPackageNames:
      - "actions/{/,}**"
      - "gaurav-nelson/{/,}**"
    matchUpdateTypes:
      - major
    matchBaseBranches:
      - main
    groupName: "third-party actions"
  - matchManagers:
      - github-actions
    matchPackageNames:
      - "actions/{/,}**"
      - "gaurav-nelson/{/,}**"
    matchUpdateTypes:
      - minor
      - patch
    matchBaseBranches:
      - main
      - "/^release\\/.*/"
    groupName: "third-party actions"
  # Docker images from simatic-ax CI
  - matchManagers:
      - github-actions
    matchDatasources:
      - docker
    matchPackageNames:
      - "ghcr.io/simatic-ax/{/,}**"
    matchUpdateTypes:
      - major
    matchBaseBranches:
      - main
    groupName: "simatic-ax docker images"
  - matchManagers:
      - github-actions
    matchDatasources:
      - docker
    matchPackageNames:
      - "ghcr.io/simatic-ax/{/,}**"
    matchUpdateTypes:
      - minor
      - patch
    matchBaseBranches:
      - main
      - "/^release\\/.*/"
    groupName: "simatic-ax docker images"

# Lockfile maintenance: updates lockfile to resolve minor/patch changes
lockFileMaintenance:
  enabled: true
  schedule: ["before 4am on Monday"]
  branchTopic: "renovate/minor-patch-updates"
  commitMessagePrefix: "chore(deps):"
  commitMessageAction: "Updates minor and patch versions in the apax-lock.json"
  baseBranchPatterns: ["main", "/^release\\/.*/"]

# Allow specific commands for post-upgrade tasks
allowedCommands:
  - "rm"
  - "apax"

# Post-upgrade tasks: regenerate apax-lock.json after dependency updates
postUpgradeTasks:
  commands:
    # remove the existing lockfile to ensure a fresh one is created
    # apax would fall back to the existing lockfile if it exists and could not detect updates
    - "rm -f apax-lock.json"
    - "apax install"
  fileFilters:
    - "apax-lock.json"
  executionMode: "update"

# Custom manager: regex-based dependency detection in apax.yml
customManagers:
  - customType: regex
    managerFilePatterns:
      - "/apax\\.yml$/"
    matchStrings:
      - "['\"](?<depName>@(ax|simatic-ax)/[a-z0-9\\-]+)['\"]\\s*:\\s*(?<currentValue>\\^?\\d+\\.\\d+\\.\\d+)"
    datasourceTemplate: npm

